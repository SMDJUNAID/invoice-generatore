<!DOCTYPE html>
<html>

<head>
    <title>Sana Mines - Invoice Form</title>

    <!-- ✅ IMPORTANT FOR MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 400px;
            /* responsive */
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            display:block;
            margin-top:5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            /* ✅ IMPORTANT */
        }

        button {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        /* ✅ Extra small screen adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                margin: 20px auto;
            }

            h2 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Invoice Input</h2>

        <label>Invoice Number</label>
        <input type="text" id="invoiceNo">

        <label>Invoice Date</label>
        <input type="date" id="invoiceDate">

        <label>Vehicle Number</label>
        <input type="text" id="vehicleNo">

        <label>Select Product</label>
        <select id="product" onchange="setHSN()">
            <option value="">-- Select Product --</option>
            <option value="Lime Stone Powder" data-hsn="2521">Lime Stone Powder</option>
            <option value="Dolamite Fines" data-hsn="2518">Dolamite Fines</option>
        </select>

        <input type="hidden" id="hsnCode">

        <label>Quantity</label>
        <input type="number" step="0.01" id="qty">

        <label>Rate</label>
        <input type="number" step="0.01" id="rate">

        <button onclick="goToInvoice()">Preview Invoice</button>
    </div>

    <script>
        window.onload = function () {
            let lastInvoice = localStorage.getItem("lastInvoiceNo");

            if (lastInvoice === null) {
                document.getElementById("invoiceNo").value = 1;
            } else {
                document.getElementById("invoiceNo").value = parseInt(lastInvoice) + 1;
            }
        }

        function setHSN() {
            const productSelect = document.getElementById("product");
            const selectedOption = productSelect.options[productSelect.selectedIndex];
            const hsn = selectedOption.getAttribute("data-hsn") || "";
            document.getElementById("hsnCode").value = hsn;
        }

        function goToInvoice() {
            const invoiceNo = document.getElementById("invoiceNo").value.trim();
            const invoiceDate = document.getElementById("invoiceDate").value;
            const vehicleNo = document.getElementById("vehicleNo").value.trim();
            const product = document.getElementById("product").value;
            const hsnCode = document.getElementById("hsnCode").value;
            const qty = document.getElementById("qty").value;
            const rate = document.getElementById("rate").value;

            if (invoiceNo === "" || invoiceDate === "" || vehicleNo === "" ||
                product === "" || qty === "" || rate === "") {
                alert("Please fill all fields");
                return;
            }

            localStorage.setItem("lastInvoiceNo", invoiceNo);
            localStorage.setItem("invoiceNo", invoiceNo);
            localStorage.setItem("invoiceDate", invoiceDate);
            localStorage.setItem("vehicleNo", vehicleNo);
            localStorage.setItem("product", product);
            localStorage.setItem("hsnCode", hsnCode);
            localStorage.setItem("qty", qty);
            localStorage.setItem("rate", rate);

            window.location.href = "invoice.html";
        }
    </script>

</body>

</html>
